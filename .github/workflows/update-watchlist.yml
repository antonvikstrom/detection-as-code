name: Refresh threat-intel watchlist

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Pull latest threat-intel feed
        run: python3 scripts/fetch_threat_intel.py
      - name: Sanity-check the resulting watchlist
        run: python3 scripts/build_watchlist_pipeline.py lookups/malicious_domains.csv
      - name: Commit refreshed watchlist if changed
        run: |
          git config user.name "detection-as-code-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lookups/malicious_domains.csv lookups/malicious_domains_splunk.csv
          git diff --cached --quiet || git commit -m "chore: refresh threat-intel watchlist [automated]"
          git push
